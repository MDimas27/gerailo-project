name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm --filter @gerailo/worker build:bundle

      - name: Guard browser bundle
        run: |
          if grep -rE "service_role|LLM_API_KEY|SUPABASE_SERVICE_ROLE" apps/web/dist; then
            echo "Kredensial server terdeteksi di bundle browser"
            exit 1
          fi

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: supabase start --workdir packages

      - name: Apply migrations
        run: supabase db reset --workdir packages

      - name: Run pgTAP tests
        run: supabase test db --workdir packages

      - name: Check generated types drift
        run: |
          supabase gen types typescript --local --workdir packages > /tmp/db.ts
          git diff --no-index --exit-code packages/supabase/types/db.ts /tmp/db.ts

  db-migrate-staging:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Push migrations to staging
        if: env.SUPABASE_DB_URL != ''
        # db.<ref>.supabase.co hanya punya AAAA (IPv6); runner GitHub IPv4-only.
        # Alihkan ke session pooler Sydney (IPv4). Jika secret sudah pooler, sed no-op.
        run: |
          set -euo pipefail
          DB_URL="$(printf '%s' "$SUPABASE_DB_URL" | sed -e 's#@db\.wdpkhhvxroxfiqkikinb\.supabase\.co:#@aws-0-ap-southeast-2.pooler.supabase.com:#' -e 's#//postgres:#//postgres.wdpkhhvxroxfiqkikinb:#')"
          supabase db push --db-url "$DB_URL" --workdir packages --yes

  deploy-staging:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @gerailo/web build

      - name: Deploy staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/worker
          command: deploy --env staging
